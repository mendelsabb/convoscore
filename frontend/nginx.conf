# Serves the built React app and proxies /api to the API service.
#
# The proxy is why the browser never needs a CORS policy or an environment-specific API URL: the
# app only ever requests relative paths, and this server decides where /api goes.

server {
    # 8080, not 80: the container runs as a non-root user and cannot bind a privileged port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness for Kubernetes. Answered by nginx itself, so it stays true when the API is down;
    # this probe is about whether the web server is serving, not whether the backend is well.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://convoscore-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A scoring request returns immediately, but the API may be slow to start under load.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Swagger, kept reachable through the same origin so a reviewer can explore the API from here.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://convoscore-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change under the same name, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any unknown path is a React route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
