{{/*
One ServiceAccount per component.

Two things matter here. First, no token is mounted: the application has no business talking to
the Kubernetes API, and not mounting the token means a compromised process has no credential to
use. Nothing in this chart grants any RBAC, which is also why the infrastructure-failure demo is
an operator command rather than a button in the UI.

Second, these are the objects that would carry the EKS Pod Identity association in production,
mapping each component to the matching least-privilege IAM role Terraform defines.
*/}}
{{- range $component := list "api" "worker" "ingestor" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "convoscore.fullname" $ }}-{{ $component }}
  labels:
    {{- include "convoscore.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    convoscore.io/production-iam-role: convoscore-{{ $component }}
automountServiceAccountToken: false
{{- end }}
