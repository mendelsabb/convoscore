# LocalStack: the AWS-compatible S3 and SQS the application actually uses locally.
#
# Version pin: 4.14.0 is the last Apache-2.0 LocalStack release. From 2026.04 the image requires
# a LocalStack account token, which would put a signup between a reviewer and `make up`. See
# DECISIONS.md section 10.
#
# Deployed from a plain manifest rather than the official Helm chart, because that chart now
# defaults to the pro image and states an auth token is required for all installations.
#
# Running inside the cluster means one runtime and one teardown: `kind delete cluster` removes
# everything. Pods reach it by cluster DNS; Terraform on the host reaches the same instance
# through the NodePort that kind maps to 127.0.0.1:4566.
---
apiVersion: v1
kind: Namespace
metadata:
  name: localstack
  labels:
    app.kubernetes.io/part-of: convoscore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: convoscore
spec:
  replicas: 1
  strategy:
    # State is in memory, so two instances would disagree. Replace rather than overlap.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/part-of: convoscore
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: edge
              containerPort: 4566
          env:
            # Only what the application uses. Starting fewer services keeps startup quick.
            - name: SERVICES
              value: "s3,sqs,iam,sts"
            # Queue URLs of the form http://<host>:4566/<account>/<name>.
            #
            # This is the only strategy whose URLs the AWS Terraform provider accepts: it
            # validates the queue URL shape, and rejects the "path" strategy's
            # /queue/<region>/<account>/<name> form outright. The URL host is never dereferenced
            # by us anyway, because boto3 sends every SQS request to the configured endpoint and
            # carries the queue URL in the request body.
            - name: SQS_ENDPOINT_STRATEGY
              value: "off"
            - name: DEBUG
              value: "0"
            - name: EAGER_SERVICE_LOADING
              value: "1"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
      volumes:
        # Ephemeral on purpose: state persistence is not available in this LocalStack release, so
        # `make up` re-applies Terraform and the application tolerates a queue that disappears.
        - name: localstack-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: convoscore
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
      # Mapped by kind to 127.0.0.1:4566 for Terraform and the demo upload script.
      nodePort: 31566
